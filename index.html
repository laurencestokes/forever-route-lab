<!doctype html>
<html lang="en-GB">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="color-scheme" content="light dark" />
    <meta
      name="description"
      content="Route planner, simulator, validator, RestedXP-format guide editor and optimisation workbench for World of Warcraft: Forever. Runs entirely in your browser."
    />
    <title>Forever Route Lab</title>
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <script>
      // Apply a stored light/dark choice before first paint, so a forced theme never flashes.
      // The key is THEME_STORAGE_KEY in src/main.tsx; keep the two in step.
      try {
        var theme = window.localStorage.getItem('forever-route-lab:theme');
        if (theme === 'light' || theme === 'dark') document.documentElement.setAttribute('data-theme', theme);
      } catch (error) {
        // Storage blocked: the system theme applies.
      }
    </script>
  </head>
  <body>
    <noscript>Forever Route Lab needs JavaScript. It runs entirely in your browser and sends nothing to a server.</noscript>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
